apiVersion: apps/v1
kind: Deployment

metadata:
  name: bpgcb
  namespace: awx-prd

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: bpgcb

  template:
    metadata:
      labels:
        app: bpgcb

    spec:
      restartPolicy: Always

      terminationGracePeriodSeconds: 30

      imagePullSecrets:
        - name: secret-automation

      containers:
        - name: bpgcb

          image: rhenancocev/bpgcb:2.6.5
          imagePullPolicy: Always

          env:
            - name: PUPPETEER_EXECUTABLE_PATH
              value: /usr/bin/chromium

          envFrom:
            - secretRef:
                name: bp-secrets

          resources:
            requests:
              cpu: 200m
              memory: 256Mi

            limits:
              cpu: 400m
              memory: 512Mi

          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 5

          volumeMounts:
            - name: data
              mountPath: /app/data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bpgcb-pvc